forceCodeSigning: false
appId: com.forgeloop.studio
productName: ForgeLoop Studio
directories:
  output: dist-electron
files:
  - dist/**/*
  - '!dist/**/*.map'
  - schemas/**/*
  - node_modules/**/*
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  identity: null
  notarize: false
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable

linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
