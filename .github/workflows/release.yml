name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/assert-release-version.mjs "${{ github.ref_name }}"
      - run: npm run audit:prod
      - run: npm run verify
      - name: Build signed macOS unpacked app
        run: npm run build && npx --no-install electron-builder --mac --dir --config electron-builder.release.yml
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke signed macOS packaged app
        run: node scripts/packaged-smoke.mjs
      - name: Build macOS distributables
        run: npx --no-install electron-builder --mac --config electron-builder.release.yml
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS artifacts
        run: |
          set -euo pipefail
          find dist-electron -name '*.app' -print -exec codesign --verify --deep --strict --verbose=4 {} \;
          find dist-electron -name '*.app' -print -exec spctl --assess --type execute --verbose=4 {} \;
          find dist-electron -name '*.app' -print -exec xcrun stapler validate {} \;
      - run: node scripts/stage-release.mjs macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeloop-studio-macos
          path: release-staging/macos/*

  windows:
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/assert-release-version.mjs "${{ github.ref_name }}"
      - run: npm run audit:prod
      - run: npm run verify
      - name: Build Windows unpacked app
        run: npm run build && npx --no-install electron-builder --win --dir
      - name: Smoke Windows packaged app
        run: node scripts/packaged-smoke.mjs
      - name: Build Windows distributables
        run: npx --no-install electron-builder --win
      - run: node scripts/stage-release.mjs windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeloop-studio-windows
          path: release-staging/windows/*

  linux:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/assert-release-version.mjs "${{ github.ref_name }}"
      - run: npm run audit:prod
      - run: npm run verify
      - name: Build Linux unpacked app
        run: npm run build && npx --no-install electron-builder --linux --dir
      - name: Smoke Linux packaged app
        run: node scripts/packaged-smoke.mjs
      - name: Build Linux distributables
        run: npx --no-install electron-builder --linux
      - run: node scripts/stage-release.mjs linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeloop-studio-linux
          path: release-staging/linux/*

  publish:
    needs: [macos, windows, linux]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: forgeloop-studio-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}
