name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  macos:
    runs-on: macos-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npm run package:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS artifacts
        run: |
          set -euo pipefail
          find dist-electron -name '*.app' -print -exec codesign --verify --deep --strict --verbose=4 {} \;
          find dist-electron -name '*.app' -print -exec spctl --assess --type execute --verbose=4 {} \;
      - run: shasum -a 256 dist-electron/* > dist-electron/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: forgeloop-studio-macos
          path: dist-electron/*
