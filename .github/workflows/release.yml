name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  macos:
    permissions:
      contents: write
    runs-on: macos-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npm run build && electron-builder --mac --config electron-builder.release.yml
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke signed packaged app
        run: node scripts/packaged-smoke.mjs
      - name: Verify macOS artifacts
        run: |
          set -euo pipefail
          find dist-electron -name '*.app' -print -exec codesign --verify --deep --strict --verbose=4 {} \;
          find dist-electron -name '*.app' -print -exec spctl --assess --type execute --verbose=4 {} \;
          find dist-electron -name '*.app' -print -exec xcrun stapler validate {} \;
      - name: Generate checksums
        run: |
          set -euo pipefail
          find dist-electron -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > dist-electron/SHA256SUMS
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/SHA256SUMS
          generate_release_notes: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeloop-studio-macos
          path: dist-electron/*
