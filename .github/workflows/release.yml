name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/assert-release-version.mjs "${{ github.ref_name }}"
      - run: npm run audit:prod
      - run: npm run verify
      - name: Build unsigned macOS preview app
        run: npm run build && npx --no-install electron-builder --mac --dir --config electron-builder.release.yml --publish never
      - name: Smoke macOS packaged app
        run: node scripts/packaged-smoke.mjs
      - name: Verify unsigned macOS packaged app
        run: |
          set -euo pipefail

          found=0
          while IFS= read -r app; do
            found=1
            test -f "$app/Contents/Resources/app.asar"
          done < <(
            find dist-electron -mindepth 2 -maxdepth 2 -name '*.app' -type d -print
          )

          test "$found" -eq 1
      - name: Build macOS unsigned distributables
        run: npx --no-install electron-builder --mac --config electron-builder.release.yml --publish never
      - name: Verify unsigned macOS artifacts
        run: |
          set -euo pipefail
          dmg_count="$(find dist-electron -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          zip_count="$(find dist-electron -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')"
          test "$dmg_count" -eq 2
          test "$zip_count" -eq 2
      - run: node scripts/stage-release.mjs macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeloop-studio-macos
          path: release-staging/macos/*

  windows:
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/assert-release-version.mjs "${{ github.ref_name }}"
      - run: npm run audit:prod
      - run: npm run verify
      - name: Build Windows unpacked app
        run: npm run build && npx --no-install electron-builder --win --dir --config electron-builder.release.yml --publish never
      - name: Smoke Windows packaged app
        run: node scripts/packaged-smoke.mjs
      - name: Build Windows distributables
        run: npx --no-install electron-builder --win --config electron-builder.release.yml --publish never
      - name: Verify Windows release matrix
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path dist-electron -File -Filter *.exe)
          if ($executables.Count -ne 2) {
            throw "Expected exactly 2 Windows executables, found $($executables.Count)"
          }
      - run: node scripts/stage-release.mjs windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeloop-studio-windows
          path: release-staging/windows/*

  linux:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/assert-release-version.mjs "${{ github.ref_name }}"
      - run: npm run audit:prod
      - run: npm run verify
      - name: Build Linux unpacked app
        run: npm run build && npx --no-install electron-builder --linux --dir --config electron-builder.release.yml --publish never
      - name: Smoke Linux packaged app
        run: xvfb-run -a node scripts/packaged-smoke.mjs
      - name: Build Linux distributables
        run: npx --no-install electron-builder --linux --config electron-builder.release.yml --publish never
      - name: Verify Linux release matrix
        run: |
          set -euo pipefail
          appimage_count="$(find dist-electron -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')"
          test "$appimage_count" -eq 1
      - run: node scripts/stage-release.mjs linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeloop-studio-linux
          path: release-staging/linux/*

  publish:
    needs: [macos, windows, linux]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: forgeloop-studio-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}
