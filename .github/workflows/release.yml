name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/assert-release-version.mjs "${{ github.ref_name }}"
      - name: Run full release verification contract
        run: npm run verify:full
      - name: Build unsigned macOS preview app
        run: npm run build && npx --no-install electron-builder --mac --dir --config electron-builder.release.yml --publish never
      - name: Smoke macOS packaged app
        run: node scripts/packaged-smoke.mjs
      - name: Apply and verify macOS Electron fuses
        run: npm run verify:electron-fuses -- dist-electron
      - name: Verify unsigned macOS packaged app
        run: |
          set -euo pipefail

          found=0
          while IFS= read -r app; do
            found=1
            test -f "$app/Contents/Resources/app.asar"
          done < <(
            find dist-electron -mindepth 2 -maxdepth 2 -name '*.app' -type d -print
          )

          test "$found" -eq 1
      - name: Build macOS unsigned distributables
        run: npx --no-install electron-builder --mac --config electron-builder.release.yml --publish never
      - name: Verify macOS release matrix
        run: node scripts/assert-release-matrix.mjs macos
      - run: node scripts/stage-release.mjs macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeloop-studio-macos
          path: release-staging/macos/*

  windows:
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/assert-release-version.mjs "${{ github.ref_name }}"
      - name: Run full release verification contract
        run: npm run verify:full
      - name: Build Windows unpacked app
        run: npm run build && npx --no-install electron-builder --win --dir --config electron-builder.release.yml --publish never
      - name: Smoke Windows packaged app
        run: node scripts/packaged-smoke.mjs
      - name: Verify Windows Electron fuses
        run: npm run verify:electron-fuses -- dist-electron
      - name: Build Windows distributables
        run: npx --no-install electron-builder --win --config electron-builder.release.yml --publish never
      - name: Verify Windows release matrix
        run: node scripts/assert-release-matrix.mjs windows
      - run: node scripts/stage-release.mjs windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeloop-studio-windows
          path: release-staging/windows/*

  linux:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/assert-release-version.mjs "${{ github.ref_name }}"
      - name: Run full release verification contract
        run: npm run verify:full
      - name: Build Linux unpacked app
        run: npm run build && npx --no-install electron-builder --linux --dir --config electron-builder.release.yml --publish never
      - name: Smoke Linux packaged app
        run: xvfb-run -a node scripts/packaged-smoke.mjs
      - name: Verify Linux Electron fuses
        run: npm run verify:electron-fuses -- dist-electron
      - name: Build Linux distributables
        run: npx --no-install electron-builder --linux --config electron-builder.release.yml --publish never
      - name: Verify Linux release matrix
        run: node scripts/assert-release-matrix.mjs linux
      - run: node scripts/stage-release.mjs linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeloop-studio-linux
          path: release-staging/linux/*

  publish:
    needs: [macos, windows, linux]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: forgeloop-studio-*
          path: release-assets
          merge-multiple: true
      - name: Generate lockfile SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application > release-assets/SBOM-cyclonedx.json
      - name: Verify staged checksums
        run: node scripts/verify-release-assets.mjs release-assets
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}
