name: Public release verification
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify'
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested release tag
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag must start with 'v' followed by a version (got: $TAG)"; exit 1 ;;
          esac
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null \
            || { echo "::error::tag $TAG does not exist in this repository"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/verify-public-release.mjs "${{ github.repository_owner }}" "${{ github.event.repository.name }}" "${{ inputs.tag || github.event.release.tag_name }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
